<script>
const AREA_MAP = {
  'ampang': '/area/local/ampang.html',
  'bandar saujana putra': '/area/local/bandar-saujana-putra.html',
  'bangi': '/area/local/bangi.html',
  'bukit jalil': '/area/local/bukit-jalil.html',
  'cheras': '/area/local/cheras.html',
  'cyberjaya / putrajaya': '/area/local/cyberjaya-putrajaya.html',

  'kepong': '/area/local/kepong.html',

  'kuala lumpur': '/area/local/kuala-lumpur.html',
  'kuala selangor': '/area/local/kuala-selangor.html',
  'langkawi': '/area/local/langkawi.html',
  'nilai': '/area/local/nilai.html',
  'petaling jaya / damansara': '/area/local/petaling-jaya.html',
  'puchong': '/area/local/puchong.html',
  'puncak alam': '/area/local/puncak-alam.html',
  'rawang': '/area/local/rawang.html',
  'selayang': '/area/local/selayang.html',
  'semenyih': '/area/local/semenyih.html',
  'sentul': '/area/local/sentul.html',
  'sepang': '/area/local/sepang.html',
  'seri kembangan': '/area/local/seri-kembangan.html',
  'setapak': '/area/local/setapak.html',
  'shah alam': '/area/local/shah-alam.html',
  'subang jaya': '/area/local/subang-jaya.html',
  'sungai buloh': '/area/local/sungai-buloh.html',
  'selangor': '/kawasan.html',
};

function toSlug(...parts) {
  return parts.filter(Boolean).join('-')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

let allListings = [];
let currentQuery = '';
let filteredListings = [];

/* ── CSV loader ─────────────────────────────────────────── */
async function loadCSV() {
  const res = await fetch('/listings.csv');
  const buf = await res.arrayBuffer();
  const text = new TextDecoder('windows-1252').decode(buf);
  const lines = text.split(/\r?\n/).filter(Boolean);
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

  allListings = lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { cols.push(cur); cur = ''; continue; }
      cur += ch;
    }
    cols.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').trim());
    return obj;
  }).filter(r => r.listing_type && r.area && (!r.status || r.status === '-' || r.status === ''));

  populateAreaFilter();
}

function populateAreaFilter() {
  const sel = document.getElementById('f-area');
  const areas = [...new Set(allListings.map(r => r.area))].sort();
  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a;
    opt.textContent = a;
    sel.appendChild(opt);
  });
}

/* ── Search ─────────────────────────────────────────────── */
function searchListings(query) {
  if (!query || query.length < 1) return allListings;
  const tokens = query.toLowerCase().split(/\s+/);
  return allListings.filter(r => {
    const haystack = [r.listing_type, r.area, r.zone, r.project_name,
      r.type, r.furnishing, r.price, r.bed, r.size, r.anchors].join(' ').toLowerCase();
    return tokens.every(t => haystack.includes(t));
  });
}

/* ── Filters ────────────────────────────────────────────── */
function applyFilters() {
  const type = document.getElementById('f-type').value;
  const area = document.getElementById('f-area').value;
  const bed  = document.getElementById('f-bed').value;
  const price = document.getElementById('f-price').value;
  const furn = document.getElementById('f-furnishing').value;

  filteredListings = currentQuery.length >= 2
    ? searchListings(currentQuery)
    : [...allListings];

  if (type) filteredListings = filteredListings.filter(r => r.listing_type === type);
  if (area) filteredListings = filteredListings.filter(r => r.area === area);
  if (bed) {
    filteredListings = filteredListings.filter(r => {
      const b = parseInt(r.bed);
      return bed === '4' ? b >= 4 : b === parseInt(bed);
    });
  }
  if (price) filteredListings = filteredListings.filter(r => parseFloat(r.price) <= parseFloat(price));
  if (furn) filteredListings = filteredListings.filter(r => r.furnishing === furn);

  renderResults();
}

function resetFilters() {
  ['f-type','f-area','f-bed','f-price','f-furnishing'].forEach(id => {
    document.getElementById(id).value = '';
  });
  applyFilters();
}

/* ── Render ─────────────────────────────────────────────── */
function fmt(price) {
  const n = parseFloat((price || '').toString().replace(/[^0-9.]/g, ''));
  if (isNaN(n)) return '—';
  if (n >= 1000000) return `RM ${(n/1000000).toFixed(2)}M`;
  if (n >= 1000) return `RM ${n.toLocaleString()}`;
  return `RM ${n}`;
}

function wa(text) {
  return `https://wa.me/60125459182?text=${encodeURIComponent(text)}`;
}

function moveInText(val) {
  const v = (val || '').trim();
  if (!v || v === '-') return '';
  return `🗓 Move-in: ${v}`;
}

/* ── Card images / carousel / lightbox ─────────────────── */
function cardImage(r) {
  const raw = (r.image || '').trim();
  let imgs = [];
  if (raw && raw !== '-') {
    let base = '';
    imgs = raw.split('|').map(s => s.trim()).filter(Boolean).map(p => {
      if (/^https?:\/\//i.test(p)) {
        base = p.substring(0, p.lastIndexOf('/') + 1);
        return p;
      }
      return base ? base + p : p;
    });
  }
  if (imgs.length === 0) imgs = ['/images/update.png'];
  const nav = imgs.length > 1 ? `
    <button type="button" class="card-img-nav prev" onclick="cardImgNav(event,this,-1)" aria-label="Previous photo">‹</button>
    <button type="button" class="card-img-nav next" onclick="cardImgNav(event,this,1)" aria-label="Next photo">›</button>
    <div class="card-img-dots">${imgs.map((_, i) => `<span class="card-img-dot${i === 0 ? ' active' : ''}"></span>`).join('')}</div>` : '';
  return `<div class="card-image-wrap" data-images="${imgs.join('|')}" data-index="0">
    <img src="${imgs[0]}" alt="${r.project_name}" class="card-image" loading="lazy" onerror="this.onerror=null;this.src='/images/update.png';" onclick="openLightbox(event,this)">${nav}
  </div>`;
}

function cardImgNav(e, btn, dir) {
  e.preventDefault();
  e.stopPropagation();
  const wrap = btn.closest('.card-image-wrap');
  const imgs = wrap.getAttribute('data-images').split('|');
  let idx = parseInt(wrap.getAttribute('data-index'), 10) || 0;
  idx = (idx + dir + imgs.length) % imgs.length;
  wrap.setAttribute('data-index', idx);
  wrap.querySelector('.card-image').src = imgs[idx];
  wrap.querySelectorAll('.card-img-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

let lbImgs = [];
let lbIdx = 0;

function openLightbox(e, img) {
  e.preventDefault();
  e.stopPropagation();
  const wrap = img.closest('.card-image-wrap');
  lbImgs = wrap.getAttribute('data-images').split('|');
  lbIdx = parseInt(wrap.getAttribute('data-index'), 10) || 0;
  renderLightbox();
  document.getElementById('lightboxOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(dir) {
  lbIdx = (lbIdx + dir + lbImgs.length) % lbImgs.length;
  renderLightbox();
}

function renderLightbox() {
  document.getElementById('lightboxImg').src = lbImgs[lbIdx];
  const nav = lbImgs.length > 1 ? `
    <button type="button" class="lightbox-nav prev" onclick="event.stopPropagation();lbNav(-1)" aria-label="Previous photo">‹</button>
    <button type="button" class="lightbox-nav next" onclick="event.stopPropagation();lbNav(1)" aria-label="Next photo">›</button>
    <div class="lightbox-dots">${lbImgs.map((_, i) => `<span class="lightbox-dot${i === lbIdx ? ' active' : ''}" onclick="event.stopPropagation();lbIdx=${i};renderLightbox()"></span>`).join('')}</div>` : '';
  document.getElementById('lightboxNavWrap').innerHTML = nav;
}

document.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('lightboxOverlay');
  if (!overlay || !overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

function renderCard(r) {
  const areaKey = (r.area || '').toLowerCase();
  const areaHref = AREA_MAP[areaKey] || '/kawasan.html';
  const slugPart2 = r.listing_type === 'room' ? r.room_type : r.bed;
  const slug = toSlug(r.project_name, slugPart2, r.price);
  const unitHref = `${areaHref}#${slug}`;

  let badge, badgeClass;
  if (r.listing_type === 'rental') { badge = 'Unit Rental'; badgeClass = 'badge-unit'; }
  else if (r.listing_type === 'room') { badge = 'Room Rental'; badgeClass = 'badge-room'; }
  else if (r.listing_type === 'lelong') { badge = 'Lelong'; badgeClass = 'badge-lelong'; }
  else { badge = 'Subsale'; badgeClass = 'badge-subsale'; }

  const priceLabel = (r.listing_type === 'rental' || r.listing_type === 'room')
    ? `${fmt(r.price)}<span> / month</span>`
    : fmt(r.price);

  const pillItems = r.listing_type === 'room'
    ? [r.room_type, r.bath_type, r.furnishing, moveInText(r.move_in_date)]
    : [r.bed ? `🛏 ${r.bed} bed` : '', r.bath ? `🚿 ${r.bath} bath` : '',
       r.size ? `${Number(r.size).toLocaleString()} sqft` : '',
       r.furnishing, (r.listing_type === 'subsale' || r.listing_type === 'lelong') ? r.tenure : r.type,
       r.listing_type === 'rental' ? moveInText(r.move_in_date) : ''];

  const pills = pillItems.filter(Boolean)
    .map(p => `<span class="pill">${p}</span>`).join('');

  const lelongDate = (r['lelong date'] || '').trim();
  const auctionPill = (r.listing_type === 'lelong' && lelongDate && lelongDate !== '-')
    ? `<div class="card-pills"><span class="pill">🔨 Auction: ${lelongDate}</span></div>`
    : '';

  const instalment = (r.listing_type === 'subsale' || r.listing_type === 'lelong') && r.installment
    ? `<div style="font-size:12px;color:#7a7268;margin-top:-6px;">Est. <strong style="color:#2a5c3a;">RM ${Number(r.installment).toLocaleString('en-MY')}</strong>/mo instalment</div>`
    : '';

  const waText = r.wa_text || `Hi Hani, I'm interested in ${r.project_name}, ${r.zone}.`;

  return `<div class="card">
    ${cardImage(r)}
    <div class="card-body">
      <div><span class="card-badge ${badgeClass}">${badge}</span>${r.code ? `<span class="card-badge badge-coa">${r.code}</span>` : ''}</div>
      <div>
        <div class="card-name">${r.project_name}</div>
        <div class="card-zone">${r.zone}</div>
        <a href="${areaHref}" class="card-area-link">📍 ${r.area}</a>
      </div>
      <div class="card-price">${priceLabel}</div>
      ${instalment}
      <div class="card-pills">${pills}</div>
      ${auctionPill}
      ${r.anchors ? `<div class="card-anchors">${r.anchors}</div>` : ''}
      <a href="${wa(waText)}" class="card-cta" target="_blank" rel="noopener noreferrer">💬 Enquire on WhatsApp</a>
      <a href="${unitHref}" class="card-view-area">View in Area Page →</a>
    </div>
  </div>`;
}

function renderResults() {
  const grid = document.getElementById('results-grid');
  const title = document.getElementById('results-title');
  const count = document.getElementById('filter-count');
  const n = filteredListings.length;

  if (n === 0) {
    grid.innerHTML = `<div class="empty"><strong>No listings found</strong>Cuba search lain — e.g. "Shah Alam 3 bed" or "Cyberjaya fully furnished"</div>`;
    title.textContent = 'No results';
    count.textContent = '';
    return;
  }

  const label = currentQuery
    ? `Results for "${currentQuery}"`
    : 'All Listings';
  title.textContent = label;
  count.textContent = `${n} listing${n !== 1 ? 's' : ''}`;
  grid.innerHTML = filteredListings.map(renderCard).join('');
}

/* ── Search trigger ─────────────────────────────────────── */
function doSearch() {
  const q = document.getElementById('hero-search').value.trim();
  currentQuery = q;
  // Update URL without reload
  const url = new URL(window.location);
  if (q) url.searchParams.set('q', q);
  else url.searchParams.delete('q');
  window.history.replaceState({}, '', url);
  applyFilters();
}

let searchDebounce;
document.getElementById('hero-search').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(doSearch, 250);
});
document.getElementById('hero-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(searchDebounce); doSearch(); }
});

/* ── Init ───────────────────────────────────────────────── */
async function init() {
  await loadCSV();
  // Pick up ?q= from URL (coming from navbar search)
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q') || '';
  if (q) {
    document.getElementById('hero-search').value = q;
    currentQuery = q;
  }
  applyFilters();
}

init();
</script>
<script src="/search.js"></script>
<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <div class="lightbox-img-wrap" onclick="event.stopPropagation()">
    <button type="button" class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <img id="lightboxImg" src="" alt="Property photo">
    <div id="lightboxNavWrap"></div>
  </div>
</div>
</body>
</html>
