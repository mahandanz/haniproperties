<!DOCTYPE html>
<html lang="en-MY">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hani Properties</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

    body {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background: linear-gradient(-45deg,#f7f9ff,#eef2ff,#f2f6ff,#e8efff);
      background-size:400% 400%;
      animation:bgMove 12s ease infinite;
    }

    @keyframes bgMove {
      0% {background-position:0% 50%}
      50% {background-position:100% 50%}
      100% {background-position:0% 50%}
    }

    .card {
      max-width:980px;
      width:100%;
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(10px);
      border-radius:26px;
      padding:36px;
      box-shadow:0 25px 70px rgba(25,35,90,0.10);
      text-align:center;
    }

    .hero img {
      width:100%;
      border-radius:20px;
    }

    .brand {
      font-size:2.6rem;
      font-weight:900;
      background:linear-gradient(90deg,#4f7cff,#6f42ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .btn {
      padding:16px;
      border-radius:18px;
      font-weight:700;
      text-decoration:none;
      display:block;
      margin-top:12px;
      transition:0.2s;
    }

    .btnSoft {
      background:#f6f8ff;
      border:1px solid rgba(79,124,255,.20);
      color:#2b2f55;
    }

    .btnWhats {
      background:#16a34a;
      color:#fff;
    }

    .btn:hover {
      transform:translateY(-2px);
    }

  </style>
</head>

<body>

  <main class="card">

    <div class="hero">
      <img src="/banner.jpg">
    </div>

    <h1 class="brand">Hani Properties</h1>

    <!-- ✅ FEATURED UNITS BUTTON -->
    <a class="btn btnSoft"
      href="https://haniproperties.notion.site/Hani-Properties-312ff4d844bb80d79e85c721c0537d59?source=copy_link"
      target="_blank"
      rel="noopener noreferrer">
      ✨ Browse Featured Units
    </a>

    <!-- ✅ WHATSAPP BUTTON -->
    <a class="btn btnWhats"
      href="https://wa.me/60125459182?text=Hi%20Hani%2C%20I%20would%20like%20to%20enquire%20about%20a%20property."
      target="_blank"
      rel="noopener noreferrer">
      💬 WhatsApp Hani
    </a>

    <!-- RENT BUTTONS -->
    <a class="btn btnSoft" href="/rental/selangor/index.html" target="_blank" rel="noopener noreferrer">Selangor Rental</a>
    <a class="btn btnSoft" href="/rental/kl/index.html" target="_blank" rel="noopener noreferrer">KL Rental</a>
    <a class="btn btnSoft" href="/rental/ns/index.html" target="_blank" rel="noopener noreferrer">NS Rental</a>

    <!-- SALE BUTTONS -->
    <a class="btn btnSoft" href="/subsale/selangor/index.html" target="_blank" rel="noopener noreferrer">Selangor Sale</a>
    <a class="btn btnSoft" href="/subsale/kl/index.html" target="_blank" rel="noopener noreferrer">KL Sale</a>
    <a class="btn btnSoft" href="/subsale/ns/index.html" target="_blank" rel="noopener noreferrer">NS Sale</a>

  </main>

</body>
</html>
